<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verification result – Claim Verifier</title>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px;
      font-weight: 600;
    }
    .claim {
      background: #f5f5f5;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-style: italic;
      border-left: 4px solid #1a73e8;
    }
    .verdict {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
    }
    .verdict.supported { color: #0d7d0d; }
    .verdict.refuted { color: #c5221f; }
    .verdict.uncertain { color: #9c6b00; }
    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    .reasoning, .error {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error {
      background: #fdecea;
      color: #c5221f;
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 4px solid #c5221f;
    }
    ul.citations {
      margin: 0;
      padding-left: 20px;
    }
    ul.citations li {
      margin-bottom: 6px;
    }
    ul.citations a {
      color: #1a73e8;
      text-decoration: none;
    }
    ul.citations a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Verification result</h1>
  <div id="content"></div>
  <script src="result.js"></script>
</body>
</html>
