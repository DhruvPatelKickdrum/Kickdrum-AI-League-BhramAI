<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verifying – Claim Verifier</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      color: #333;
      background: #fafafa;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0e0e0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      font-weight: 500;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="spinner" aria-hidden="true"></div>
  <p class="message">Verifying your claim…</p>
  <script src="loading.js"></script>
</body>
</html>
